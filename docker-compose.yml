services:
  app:
    build:
      context: .
      dockerfile: dev/php/Dockerfile
    image: shop-api
    container_name: shop-api-app
    restart: unless-stopped
    tty: true
    working_dir: /var/www/html
    environment:
      APP_URL: http://localhost:84
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: shop_api
      DB_USERNAME: root
      DB_PASSWORD: password
      CACHE_STORE: array
      QUEUE_CONNECTION: database
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./:/var/www/html:delegated
      - vendor_data:/var/www/html/vendor
    networks:
      - shop-api-net

  mysql:
    image: mysql:8.0
    container_name: shop-api-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: shop_api
      MYSQL_ROOT_PASSWORD: password
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ppassword"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shop-api-net

  nginx:
    build:
      context: ./dev/nginx/
      dockerfile: Dockerfile
    image: shop-api-nginx
    container_name: shop-api-nginx
    restart: unless-stopped
    tty: true
    ports:
      - "84:80"
    depends_on:
      - app
    volumes:
      - ./:/var/www/html:delegated
    networks:
      - shop-api-net

  phpmyadmin:
    image: phpmyadmin:5
    container_name: shop-api-phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: password
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - shop-api-net

networks:
  shop-api-net:
    driver: bridge

volumes:
  dbdata:
    driver: local
  vendor_data:
    driver: local
